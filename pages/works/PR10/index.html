<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оконные профили REHAU</title>
    <link rel="stylesheet" href="../PR10/style/style.css">
</head>
<body>
    <section class="rehau-profiles">
        <div class="container">
            <h1 class="section-title">ОКОННЫЕ ПРОФИЛИ REHAU</h1>
            
            <div class="content-wrapper">
                <div class="certificate-block">
                    <img src="../PR10/img/1.png" alt="Сертификат REHAU" class="certificate-image">
                </div>

                <div class="features-block">
                    <div class="features-grid">
                        <div class="feature-item">
                            <div class="feature-icon">
                                <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                                    <circle cx="18" cy="18" r="10" stroke="#9b59b6" stroke-width="2"/>
                                    <circle cx="30" cy="18" r="10" stroke="#9b59b6" stroke-width="2"/>
                                    <circle cx="18" cy="30" r="10" stroke="#9b59b6" stroke-width="2"/>
                                    <circle cx="30" cy="30" r="10" stroke="#9b59b6" stroke-width="2"/>
                                </svg>
                            </div>
                            <p class="feature-text">На выбор 6 серий профиля REHAU: от бюджетного варианта до стандартного и премиум сегмента.</p>
                        </div>

                        <div class="feature-item">
                            <div class="feature-icon">
                                <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                                    <circle cx="24" cy="24" r="18" stroke="#9b59b6" stroke-width="2"/>
                                    <path d="M24 14L26 20L32 20L27 24L29 30L24 26L19 30L21 24L16 20L22 20L24 14Z" fill="#9b59b6"/>
                                </svg>
                            </div>
                            <p class="feature-text">Гарантия на продукцию производителя - до 60 лет</p>
                        </div>

                        <div class="feature-item">
                            <div class="feature-icon">
                                <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                                    <rect x="12" y="16" width="20" height="24" stroke="#9b59b6" stroke-width="2"/>
                                    <rect x="16" y="12" width="20" height="24" stroke="#9b59b6" stroke-width="2"/>
                                </svg>
                            </div>
                            <p class="feature-text">От 3 до 6 воздушных камер;</p>
                        </div>

                        <div class="feature-item">
                            <div class="feature-icon">
                                <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                                    <line x1="8" y1="24" x2="40" y2="24" stroke="#9b59b6" stroke-width="2"/>
                                    <path d="M20 16L28 24L20 32" stroke="#9b59b6" stroke-width="2"/>
                                    <path d="M28 16L20 24L28 32" stroke="#9b59b6" stroke-width="2"/>
                                </svg>
                            </div>
                            <p class="feature-text">Глубина профиля от 60 до 86 мм;</p>
                        </div>

                        <div class="feature-item">
                            <div class="feature-icon">
                                <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                                    <path d="M24 8V4M24 44V40M36.36 11.64L33.54 8.82M14.46 39.18L11.64 36.36M40 24H44M4 24H8M36.36 36.36L33.54 39.18M14.46 8.82L11.64 11.64" stroke="#9b59b6" stroke-width="2"/>
                                    <circle cx="24" cy="24" r="10" stroke="#9b59b6" stroke-width="2"/>
                                    <path d="M20 24L22 26L28 20" stroke="#9b59b6" stroke-width="2"/>
                                </svg>
                            </div>
                            <p class="feature-text">Высокая теплозащита: до 0,9 м2°C/Вт</p>
                        </div>
                    </div>

                    <div class="partner-info">
                        <p class="partner-text">Мы сертифицированный партнер Rehau:</p>
                        <button class="btn-certificate">ПОСМОТРЕТЬ СЕРТИФИКАТ</button>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
